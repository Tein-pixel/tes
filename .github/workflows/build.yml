name: Build TeinLite APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build optimized signed APK
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Measure APK size
        id: size
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BYTES=$(stat -c '%s' "$APK")
          echo "APK size: ${BYTES} bytes ($(( (BYTES + 1023) / 1024 )) KiB)"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
          if [ "$BYTES" -gt 35840 ]; then
            echo "::warning::APK is larger than the 35 KiB target. Artifact will still be uploaded for diagnosis."
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeinLite-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK release when within 35 KiB
        if: ${{ steps.size.outputs.bytes != '' && fromJSON(steps.size.outputs.bytes) <= 35840 && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 app/build/outputs/apk/release/app-release.apk \
            --title "TeinLite 1.0.0" \
            --notes "Minimal Android 10+ launcher. Offline, pure black, no UI libraries, no animations or background services."
