name: Build TeinLite Blank Launcher
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build optimized release APK
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Measure APK size and checksum
        id: size
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BYTES=$(stat -c '%s' "$APK")
          echo "APK size: ${BYTES} bytes"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
          if [ "$BYTES" -gt 16384 ]; then
            echo "::warning::APK exceeds the aspirational 16 KiB target."
          fi
          if [ "$BYTES" -gt 20000 ]; then
            echo "::warning::APK exceeds the 20,000-byte target; artifact is retained for inspection."
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeinLite-1.0.2-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK release when under 20 KB
        if: ${{ steps.size.outputs.bytes != '' && fromJSON(steps.size.outputs.bytes) <= 20000 && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n1)
          gh release create "v$VERSION" app/build/outputs/apk/release/app-release.apk --title "TeinLite Blank $VERSION" --notes "Blank-first Android 10+ launcher. Home starts empty; swipe up to open the app drawer and long-press an app to add it. No network, ads, UI libraries, background services or animations."
