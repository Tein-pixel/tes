name: Build XRecover APK

on:
  push:
    branches: [xrecover-v1]
    paths:
      - 'xrecover/**'
      - '.github/workflows/xrecover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xrecover
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build optimized release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/XRecover.apk

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/XRecover.apk

      - name: Verify package, Android compatibility, and local-only design
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/XRecover.apk | tee /tmp/xrecover-badging.txt
          grep -q "package: name='com.teinzz.xrecover'" /tmp/xrecover-badging.txt
          grep -q "versionName='1.2.0'" /tmp/xrecover-badging.txt
          grep -q "sdkVersion:'29'" /tmp/xrecover-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/release/XRecover.apk | tee /tmp/xrecover-permissions.txt
          if grep -q "android.permission.INTERNET" /tmp/xrecover-permissions.txt; then
            echo "XRecover must stay local-only and must not request INTERNET permission."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRecover-release-APK
          path: xrecover/app/build/outputs/apk/release/XRecover.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xrecover-v1.2.0
          target_commitish: xrecover-v1
          name: XRecover v1.2.0 (Android 10+)
          body: |
            Optimized installable APK for XRecover v1.2.0.\n            Indonesian recovery guide with issue-specific support text and local-only history.
            Minimum Android: 10 (API 29).\n            No automatic submission to WhatsApp. Use the official in-app review flow when available.
            This app is an independent guide and is not affiliated with WhatsApp.
          files: xrecover/app/build/outputs/apk/release/XRecover.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

