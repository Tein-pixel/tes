name: Build XRecover APK

on:
  push:
    branches: [xrecover-v1]
    paths:
      - 'xrecover/**'
      - '.github/workflows/xrecover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xrecover
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/XRecover.apk

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/XRecover.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRecover-release-APK
          path: xrecover/app/build/outputs/apk/release/XRecover.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xrecover-v1.0.0
          target_commitish: xrecover-v1
          name: XRecover v1.0.0 (Android 10+)
          body: |
            Optimized installable APK for XRecover.
            Minimum Android: 10 (API 29).
            This app is an independent guide and is not affiliated with WhatsApp.
          files: xrecover/app/build/outputs/apk/release/XRecover.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo "# XRecover build status"
            echo
            echo "- Result: $JOB_RESULT"
            echo "- Run: $RUN_ID"
            echo "- Source commit: $COMMIT_SHA"
            echo "- Updated (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          } > xrecover-build-status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xrecover-build-status.md
          git commit -m "Record XRecover build result: $JOB_RESULT" || exit 0
          git push origin HEAD:xrecover-v1
