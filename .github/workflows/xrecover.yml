name: Build XRecover APK

on:
  push:
    branches: [xrecover-v1]
    paths:
      - 'xrecover/**'
      - '.github/workflows/xrecover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xrecover
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRecover-debug-APK
          path: xrecover/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xrecover-v1-build
          target_commitish: xrecover-v1
          name: XRecover v1.0.0 (Android 10+)
          body: |
            Installable debug APK for XRecover.
            Minimum Android: 10 (API 29).
            This app is an independent guide and is not affiliated with WhatsApp.
          files: xrecover/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
