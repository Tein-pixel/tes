name: XRecover v1.6.0 Functional

on:
  push:
    branches:
      - xrecover-v1.6-functional
    paths:
      - "xrecover-app/**"
      - ".github/workflows/xrecover-v1-5-smtp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build functional release APK
        run: gradle -p xrecover-app assembleRelease --no-daemon

      - name: Verify APK metadata and report size
        shell: bash
        run: |
          set -euo pipefail
          APK="xrecover-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.teinzz.xrecover' versionCode='8' versionName='1.6.0'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "sdkVersion:'29'"
          cp "$APK" XRecover-v1.6.0.apk
          sha256sum XRecover-v1.6.0.apk
          ls -lh XRecover-v1.6.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRecover-v1.6.0-APK
          path: XRecover-v1.6.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xrecover-v1.6.0
          target_commitish: xrecover-v1.6-functional
          name: XRecover v1.6.0 (functional)
          body: |
            XRecover v1.6.0 prioritizes reliable functionality over APK size.
            - Manual SMTP with visible user-configured host, sender, and recipient.
            - SMTP connection/authentication test button before sending.
            - TLS required on port 465 (SSL) or 587 (STARTTLS).
            - SMTP password is not persisted.
            - Draft fields and report text persist locally between app launches.
            - Clear SMTP diagnostics, local status/history, report timeline, FAQ, and theme settings.
            Test release signed with the standard CI debug key.
          files: XRecover-v1.6.0.apk
          fail_on_unmatched_files: true
